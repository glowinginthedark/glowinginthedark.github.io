<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> -->
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=7">
    <title>Bilal</title>

    <style>
        body {
            cursor: url('normal-cursor-small.png'), auto;
            display: flex;
            justify-content: center;
            align-items: safe center;
            min-height: 100vh;
            min-height: 100svh;
            box-sizing: border-box;
            padding: clamp(28px, 7vw, 80px) 24px;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f6f3eb;
            transform: scale(1.0);
        }

        body *::selection {
            background-color: black;
            color: #FFFAFA;
        }

        body *::-moz-selection {
            background-color: black;
            color: #FFFAFA;
        }

        a {
            /* text-decoration: none; */
            color: black;
            cursor: url('pointer-cursor-small.png'), auto;
        }

        p {
            font-size: 24px;
            text-align: left;
            font-family: "Gowun Batang", serif;
            font-weight: 400;
            font-style: normal;
        }

        a {
            color: black;
        }

        a:visited {
            color: black;
        }

        .profile {
            display: grid;
            grid-template-columns: minmax(0, 260px) minmax(0, 370px);
            align-items: start;
            gap: 48px;
            width: min(100%, 678px);
        }

        .me-image {
            display: block;
            border-radius: 16px;
            width: 100%;
            height: auto;
        }

        #description p {
            margin: 0 0 15px;
            line-height: 1.45;
        }

        .contact-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0 20px;
            margin-top: 15px;
            font: 18px/1.4 "Gowun Batang", serif;
        }

        .contact-links a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
        }

        .selected-work {
            border-top: 1px solid #0003;
            margin-top: 22px;
            padding-top: 18px;
        }

        .selected-work h2 {
            font: 13px/1.4 Arial, sans-serif;
            letter-spacing: .06em;
            margin: 0 0 9px;
        }

        .robot-icon {
            width: 1em;
            height: 1em;
            vertical-align: -0.12em;
            margin-left: 0.12em;
        }

        .project-description {
            display: block;
            margin-top: 4px;
            font-size: 20px;
            line-height: 1.55;
            color: #454545;
        }

        @media (max-width: 660px) {
            .profile {
                grid-template-columns: minmax(0, 1fr);
                max-width: 370px;
                gap: 25px;
            }

            .me-image {
                width: min(100%, 260px);
            }

            #description p {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="profile">
        <div class="me-image-container">
            <img class="me-image" src="me.jpeg" alt="Bilal">
        </div>
        <div id="description">
            <p>
                Hi, my name is Bilal.
            </p>
            <p>
                I'm a software developer based in Vancouver, Canada.
            </p>
            <p>
                I'm currently building AI agents for cybersecurity at <a href="https://www.worksafebc.com/" target="_blank" rel="noopener">WorkSafeBC</a>.
            </p>
            <nav class="contact-links" aria-label="Contact">
                <a href="mailto:solidhydrogenblock@gmail.com">Email</a>
                <a href="https://www.linkedin.com/in/bilal-zubair-3a2b02186/">LinkedIn</a>
            </nav>
            <section class="selected-work" aria-labelledby="selected-work-title">
                <h2 id="selected-work-title">Selected work</h2>
                <p class="project">
                    <a class="project-link" href="/remediation/">Remediation Lab <svg class="robot-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 7V4"/><circle cx="12" cy="3" r="1"/><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M1.5 12v4M22.5 12v4M9 16h6"/><circle cx="8.5" cy="12" r=".8" fill="currentColor" stroke="none"/><circle cx="15.5" cy="12" r=".8" fill="currentColor" stroke="none"/></svg></a>
                    <span class="project-description">AI agents for dependency upgrades and verification.</span>
                </p>
            </section>
        </div>
    </main>
</body>
</html>
